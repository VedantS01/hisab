name: Hisab
options:
  bundleIdPrefix: com.vedants
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HisabCore:
    path: HisabCore
targets:
  Hisab:
    type: application
    platform: iOS
    sources:
      - Hisab
    dependencies:
      - package: HisabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vedants.hisab
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: 3
        DEVELOPMENT_TEAM: AQQHT55AT9
        CODE_SIGN_STYLE: Automatic
    info:
      path: Hisab/Info.plist
      properties:
        CFBundleDisplayName: Hisab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.vedants.hisab.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - hisab
  HisabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HisabUITests
    dependencies:
      - target: Hisab
      - package: HisabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vedants.hisab.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Hisab
        DEVELOPMENT_TEAM: AQQHT55AT9
        CODE_SIGN_STYLE: Automatic
