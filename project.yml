name: Hisab
options:
  bundleIdPrefix: com.vedants
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HisabCore:
    path: HisabCore
targets:
  Hisab:
    type: application
    platform: iOS
    sources:
      - Hisab
    dependencies:
      - package: HisabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vedants.hisab
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: 4
        DEVELOPMENT_TEAM: AQQHT55AT9
        CODE_SIGN_STYLE: Automatic
    info:
      path: Hisab/Info.plist
      properties:
        CFBundleDisplayName: Hisab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.vedants.hisab.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - hisab
        # Opening IN PLACE, not by copy: the file stays where the user keeps
        # it and Hisab reads it once. A copy would land in the app's Inbox/
        # and quietly become a second home for the user's statements, which
        # a zero-network app that already keeps its own copy under
        # Documents/imports has no business creating.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          # `Alternate`, deliberately: Hisab is offering itself as a
          # destination for a statement, not claiming to be the system's PDF
          # or CSV handler. Owner rank would put it ahead of Files and
          # Preview for every PDF on the phone.
          - CFBundleTypeName: Statement
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.comma-separated-values-text
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.excel.xls
              - public.plain-text
  HisabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HisabUITests
    dependencies:
      - target: Hisab
      - package: HisabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vedants.hisab.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Hisab
        DEVELOPMENT_TEAM: AQQHT55AT9
        CODE_SIGN_STYLE: Automatic
