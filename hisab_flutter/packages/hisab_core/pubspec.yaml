name: hisab_core
description: >-
  Pure-Dart port of HisabCore: parsing, dedup, reconciliation, analytics,
  and the generic self-validating bank-statement engine. No Flutter, no
  network — mirrors the Swift package module-for-module.
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.5
  syncfusion_flutter_pdf: ^28.1.33
  xml: ^6.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
