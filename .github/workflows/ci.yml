name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: HisabCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test --package-path HisabCore

  app-build:
    name: App builds for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild -project Hisab.xcodeproj -scheme Hisab
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
